              componentInputParameter: epochs
            pipelinechannel--gcs_model_uri:
              componentInputParameter: gcs_model_uri
            pipelinechannel--gcs_raw_data_uri:
              componentInputParameter: gcs_raw_data_uri
            pipelinechannel--machine_type:
