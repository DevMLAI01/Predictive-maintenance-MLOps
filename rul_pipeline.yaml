          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-storage'\
          \ 'numpy<2.0' 'pandas'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_data(\n    gcs_data_uri: str,\n    validation_report:\
          \ Output[Metrics],\n) -> NamedTuple(\"Outputs\", [(\"is_valid\", bool),\
          \ (\"n_engines\", int)]):\n    import json\n    import os\n    import tempfile\n\
          \    from collections import namedtuple\n\n    import pandas as pd\n   \
          \ from google.cloud import storage as gcs\n\n    COLUMNS = [\"engine_id\"\
          , \"cycle\", \"op_setting_1\", \"op_setting_2\", \"op_setting_3\"] + [\n\
          \        f\"sensor_{i}\" for i in range(1, 22)\n    ]\n    EXPECTED_SENSORS\
          \ = [f\"sensor_{i}\" for i in range(1, 22)]\n\n    def _download(src: str,\
          \ dst: str) -> None:\n        without_scheme = src[5:]\n        bucket_name,\
          \ _, blob_path = without_scheme.partition(\"/\")\n        gcs.Client().bucket(bucket_name).blob(blob_path).download_to_filename(dst)\n\
          \n    with tempfile.TemporaryDirectory() as tmp:\n        local_train =\
          \ os.path.join(tmp, \"train_FD001.txt\")\n        print(f\"Downloading {gcs_data_uri}/train_FD001.txt\"\
          )\n        _download(f\"{gcs_data_uri}/train_FD001.txt\", local_train)\n\
          \n        df = pd.read_csv(\n            local_train,\n            sep=r\"\
          \\s+\",\n            header=None,\n            names=COLUMNS,\n        \
          \    engine=\"python\",\n        )[COLUMNS]\n        df[\"engine_id\"] =\
          \ df[\"engine_id\"].astype(int)\n        df[\"cycle\"] = df[\"cycle\"].astype(int)\n\
          \n    no_nulls = bool(df.isnull().sum().sum() == 0)\n    sensors_ok = all(s\
          \ in df.columns for s in EXPECTED_SENSORS)\n    n_engines = int(df[\"engine_id\"\
          ].nunique())\n    engine_count_ok = n_engines > 50\n    is_valid = no_nulls\
          \ and sensors_ok and engine_count_ok\n\n    print(\n        json.dumps(\n\
          \            {\n                \"is_valid\": is_valid,\n              \
          \  \"n_engines\": n_engines,\n                \"no_nulls\": no_nulls,\n\
          \                \"sensors_ok\": sensors_ok,\n                \"rows\":\
          \ len(df),\n            },\n            indent=2,\n        )\n    )\n\n\
          \    validation_report.log_metric(\"is_valid\", int(is_valid))\n    validation_report.log_metric(\"\
          n_engines\", n_engines)\n    validation_report.log_metric(\"no_nulls\",\
          \ int(no_nulls))\n    validation_report.log_metric(\"rows\", len(df))\n\n\
          \    Outputs = namedtuple(\"Outputs\", [\"is_valid\", \"n_engines\"])\n\
          \    return Outputs(is_valid=is_valid, n_engines=n_engines)\n\n"
